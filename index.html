<script>
  // ==========================================
  // MÁSCARA TELEFONE
  // ==========================================
  const phoneInput = document.getElementById('whatsapp');

  phoneInput.addEventListener('input', function(e) {
    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);

    e.target.value = !x[2]
      ? x[1]
      : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
  });

  // ==========================================
  // NAVEGAÇÃO ENTRE ETAPAS
  // ==========================================
  function nextStep(currentStepIndex) {
    const currentStepDiv = document.getElementById(`step-${currentStepIndex}`);
    const inputs = currentStepDiv.querySelectorAll('input, select');

    let isValid = true;

    for (let i = 0; i < inputs.length; i++) {
      let input = inputs[i];

      if (!input.checkValidity() || input.value.trim() === "") {
        isValid = false;
        input.style.border = "1px solid #d60000";
        input.reportValidity();
        break;
      } else {
        input.style.border = "1px solid transparent";
      }
    }

    if (isValid) {
      document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
      document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');

      updateDots(currentStepIndex);
    }
  }

  function prevStep(currentStepIndex) {
    document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
    document.getElementById(`step-${currentStepIndex - 1}`).classList.add('active');

    updateDots(currentStepIndex - 2);
  }

  function updateDots(activeIndex) {
    const dots = document.querySelectorAll('.dot');

    dots.forEach((dot, index) => {
      if (index === activeIndex) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  // ==========================================
  // CAPTURA UTM
  // ==========================================
  function getUTMs() {
    const params = new URLSearchParams(window.location.search);

    return {
      utm_source: params.get('utm_source') || '',
      utm_medium: params.get('utm_medium') || '',
      utm_campaign: params.get('utm_campaign') || '',
      utm_content: params.get('utm_content') || '',
      utm_term: params.get('utm_term') || '',
      fbclid: params.get('fbclid') || '',
      gclid: params.get('gclid') || ''
    };
  }

  // ==========================================
  // GEOLOCALIZAÇÃO POR IP
  // ==========================================
  async function getLocationData() {
    try {
      const response = await fetch('https://ipapi.co/json/');
      const data = await response.json();

      return {
        cidade: data.city || '',
        estado: data.region || '',
        regiao: data.region_code || '',
        pais: data.country_name || ''
      };
    } catch (error) {
      console.error('Erro localização:', error);

      return {
        cidade: '',
        estado: '',
        regiao: '',
        pais: ''
      };
    }
  }

  // ==========================================
  // SUBMIT FINAL
  // ==========================================
  document.getElementById('multi-step-form').addEventListener('submit', async function(e) {

    e.preventDefault();

    const btn = document.querySelector('#step-3 .btn-submit');

    btn.disabled = true;
    btn.innerText = 'Enviando...';

    try {

      const locationData = await getLocationData();
      const utms = getUTMs();

      const payload = {

        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        negocio: document.getElementById('negocio').value,
        pedidos: document.getElementById('pedidos').value,
        falta: document.getElementById('falta').value,

        ...utms,
        ...locationData,

        page_url: window.location.href,
        page_title: document.title,
        user_agent: navigator.userAgent,
        timestamp: new Date().toISOString()
      };

      // ==========================================
      // ENVIA AO MAKE
      // ==========================================
      await fetch(
        'https://hook.us1.make.celonis.com/8ys6r6jx8rpfewiwnuo0fbfzvrpwcqyd',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        }
      );

      // ==========================================
      // REDIRECIONA WHATSAPP
      // ==========================================
      const texto =
        `Olá! Meu nome é ${payload.nome}. Tenho um(a) ${payload.negocio} e gostaria de receber o catálogo técnico.`;

      const linkWa =
        `https://api.whatsapp.com/send/?phone=559822220088&text=${encodeURIComponent(texto)}`;

      window.open(linkWa, '_blank');

    } catch (error) {

      console.error(error);

      alert(
        'Houve um erro ao enviar seus dados. Tente novamente.'
      );

    } finally {

      btn.disabled = false;
      btn.innerText = 'Quero o catálogo técnico';

    }
  });
</script>
