<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

  .form-container {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(21, 31, 109, 0.08);
    max-width: 480px;
    margin: 0 auto;
    font-family: 'Poppins', sans-serif;
  }

  .form-step {
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .form-step.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: #151F6D;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .form-input, .form-select {
    width: 100%;
    padding: 16px;
    background-color: #F4F6F9;
    border: 1px solid transparent;
    border-radius: 6px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    color: #151F6D;
    transition: all 0.3s ease;
    box-sizing: border-box;
    appearance: none;
  }

  .form-input::placeholder, .form-select:invalid {
    color: #8A94A6;
  }

  .form-input:focus, .form-select:focus {
    border-color: #F1C400;
    background-color: #ffffff;
    outline: none;
  }

  /* Seta customizada para o Select */
  .form-select {
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1.5 1.5L6 6L10.5 1.5' stroke='%23151F6D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    padding-right: 40px;
    cursor: pointer;
  }

  /* Botões */
  .btn-submit {
    width: 100%;
    background-color: #F1C400;
    color: #151F6D;
    font-size: 15px;
    font-weight: 700;
    padding: 16px;
    border: none;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(241, 196, 0, 0.25);
    margin-top: 8px;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(241, 196, 0, 0.4);
  }
  
  .btn-submit:disabled {
    background-color: #d1d8e0;
    color: #8A94A6;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .btn-back {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: #8A94A6;
    font-size: 14px;
    font-weight: 600;
    margin-top: 16px;
    cursor: pointer;
    text-decoration: underline;
    transition: color 0.2s;
  }

  .btn-back:hover {
    color: #151F6D;
  }

  .whatsapp-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 14px;
    font-weight: 700;
    color: #151F6D;
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: color 0.2s;
  }

  .whatsapp-link:hover {
    color: #F1C400;
  }
  
  /* Indicador de passos */
  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .dot {
    width: 8px;
    height: 8px;
    background-color: #E2E8F0;
    border-radius: 50%;
    transition: 0.3s;
  }
  .dot.active {
    background-color: #151F6D;
    width: 24px;
    border-radius: 4px;
  }
</style>

<div class="form-container">
  
  <div class="step-indicator" id="step-dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <form id="multi-step-form">
    
    <div class="form-step active" id="step-1">
      <div class="form-group">
        <label class="form-label" for="nome">Nome</label>
        <input type="text" id="nome" class="form-input" placeholder="Seu nome" required>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="whatsapp">WhatsApp</label>
        <input type="tel" id="whatsapp" class="form-input" placeholder="(98) 9 0000-0000" required minlength="14">
      </div>
      
      <button type="button" class="btn-submit" onclick="nextStep(1)">Avançar</button>
    </div>

    <div class="form-step" id="step-2">
      <div class="form-group">
        <label class="form-label" for="negocio">Qual é o seu tipo de negócio?</label>
        <select id="negocio" class="form-select" required>
          <option value="" disabled selected>Selecione uma opção</option>
          <option value="Oficina mecânica">Oficina mecânica</option>
          <option value="Revendedor / Auto peças">Revendedor / Auto peças</option>
          <option value="Frota própria">Frota própria</option>
          <option value="Agropecuária">Agropecuária</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="pedidos">Quantos pedidos você faz por mês?</label>
        <select id="pedidos" class="form-select" required>
          <option value="" disabled selected>Selecione uma opção</option>
          <option value="Até 20 pedidos">Até 20 pedidos</option>
          <option value="De 20 a 50 pedidos">De 20 a 50 pedidos</option>
          <option value="De 50 a 100 pedidos">De 50 a 100 pedidos</option>
          <option value="Mais de 100 pedidos">Mais de 100 pedidos</option>
        </select>
      </div>

      <button type="button" class="btn-submit" onclick="nextStep(2)">Avançar</button>
      <button type="button" class="btn-back" onclick="prevStep(2)">Voltar para etapa anterior</button>
    </div>

    <div class="form-step" id="step-3">
      <div class="form-group">
        <label class="form-label" for="falta">O que mais falta no seu fornecedor atual?</label>
        <select id="falta" class="form-select" required>
          <option value="" disabled selected>Selecione uma opção</option>
          <option value="Entrega rápida">Entrega rápida</option>
          <option value="Estoque garantido">Estoque garantido</option>
          <option value="Suporte técnico">Suporte técnico</option>
          <option value="Preço competitivo">Preço competitivo</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="btn-finalizar">Quero o catálogo técnico</button>
      <button type="button" class="btn-back" onclick="prevStep(3)">Voltar para etapa anterior</button>
    </div>

  </form>

  <a href="https://api.whatsapp.com/send/?phone=559822220088" class="whatsapp-link" target="_blank" rel="noopener">
    Prefere falar agora? → WhatsApp direto
  </a>
</div>

<script>
  // ==========================================
  // FUNÇÕES DE TRACKING E IDENTIFICAÇÃO (Estilo OFOS)
  // ==========================================
  
  // user_id persistente (identifica o navegador entre sessões)
  function getUserId() {
    var key = 'universo_user_id';
    var id = localStorage.getItem(key);
    if (!id) {
      id = 'u_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem(key, id);
    }
    return id;
  }

  // Captura todos os parâmetros de tracking da URL
  function capturarTracking() {
    const p = new URLSearchParams(window.location.search);
    return {
      utm_source:   p.get('utm_source')   || '',
      utm_medium:   p.get('utm_medium')   || '',
      utm_campaign: p.get('utm_campaign') || '',
      utm_content:  p.get('utm_content')  || '',
      utm_term:     p.get('utm_term')     || '',
      gclid:        p.get('gclid')        || '',
      fbclid:       p.get('fbclid')       || '',
      cidade:       p.get('cidade')       || '',
      estado:       p.get('estado')       || '',
      regiao:       p.get('regiao')       || '',
      page_url:     window.location.href  || '',
      user_agent:   navigator.userAgent   || '',
      user_id:      getUserId()
    };
  }

  // ==========================================
  // LÓGICA DE INTERFACE DO FORMULÁRIO UNIVERSO
  // ==========================================

  // Máscara de Telefone (WhatsApp)
  const phoneInput = document.getElementById('whatsapp');
  phoneInput.addEventListener('input', function(e) {
    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
    e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
  });

  // Navegação entre os passos com trava de validação rigorosa
  function nextStep(currentStepIndex) {
    const currentStepDiv = document.getElementById(`step-${currentStepIndex}`);
    const inputs = currentStepDiv.querySelectorAll('input, select');
    let isValid = true;

    // Percorre os campos do passo atual e trava no primeiro que estiver inválido ou vazio
    for (let i = 0; i < inputs.length; i++) {
      let input = inputs[i];
      
      if (!input.checkValidity() || input.value.trim() === "") {
        isValid = false;
        input.style.border = "1px solid #d60000"; // Pinta a borda de vermelho
        input.reportValidity(); // Mostra o aviso nativo do navegador
        break; // Interrompe o loop para focar no erro
      } else {
        input.style.border = "1px solid transparent"; // Remove o erro se estiver ok
      }
    }

    // Só avança se a variável isValid continuar true
    if (isValid) {
      document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
      document.getElementById(`step-${currentStepIndex + 1}`).classList.add('active');
      updateDots(currentStepIndex); // Atualiza os pontinhos
    }
  }

  function prevStep(currentStepIndex) {
    document.getElementById(`step-${currentStepIndex}`).classList.remove('active');
    document.getElementById(`step-${currentStepIndex - 1}`).classList.add('active');
    updateDots(currentStepIndex - 2); // Atualiza os pontinhos
  }

  // Atualiza os indicadores (pontinhos) do topo
  function updateDots(activeIndex) {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, index) => {
      if(index === activeIndex) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  // ==========================================
  // ENVIO VIA WEBHOOK E REDIRECIONAMENTO WHATSAPP
  // ==========================================
  
  document.getElementById('multi-step-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Impede o recarregamento da página (só dispara no botão tipo submit da última etapa)
    
    // Altera o estado do botão para evitar envios duplicados
    const btnSubmit = document.getElementById('btn-finalizar');
    const textoOriginalBtn = btnSubmit.textContent;
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Enviando...';

    // Captura os dados preenchidos visíveis
    const nome = document.getElementById('nome').value;
    const whatsapp = document.getElementById('whatsapp').value;
    const negocio = document.getElementById('negocio').value;
    const pedidos = document.getElementById('pedidos').value;
    const falta = document.getElementById('falta').value;
    
    // Captura os dados ocultos (Tracking/UTMs)
    const tracking = capturarTracking();

    // Monta o Payload completo
    const dadosCompletos = {
      nome: nome,
      whatsapp: whatsapp,
      negocio: negocio,
      pedidos: pedidos,
      falta: falta,
      dataEnvio: new Date().toLocaleString('pt-BR'),
      timestamp: new Date().toISOString(),
      utm_source: tracking.utm_source,
      utm_medium: tracking.utm_medium,
      utm_campaign: tracking.utm_campaign,
      utm_content: tracking.utm_content,
      utm_term: tracking.utm_term,
      gclid: tracking.gclid,
      fbclid: tracking.fbclid,
      cidade: tracking.cidade,
      estado: tracking.estado,
      regiao: tracking.regiao,
      page_url: tracking.page_url,
      user_agent: tracking.user_agent,
      user_id: tracking.user_id
    };

    // Envia os dados para o Webhook Celonis/Make
    fetch('https://hook.us1.make.celonis.com/8ys6r6jx8rpfewiwnuo0fbfzvrpwcqyd', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(dadosCompletos)
    })
    .then(response => {
      console.log('Webhook disparado com sucesso:', response.status);
      redirecionarParaWhatsApp(nome, negocio);
    })
    .catch(error => {
      console.error('Erro ao enviar para o Webhook:', error);
      // Redireciona mesmo em caso de erro para não prejudicar a jornada do usuário
      redirecionarParaWhatsApp(nome, negocio);
    })
    .finally(() => {
      // Restaura o botão caso o usuário feche a nova aba e volte para a página
      btnSubmit.disabled = false;
      btnSubmit.textContent = textoOriginalBtn;
    });
  });

  // Função isolada para o redirecionamento
  function redirecionarParaWhatsApp(nome, negocio) {
    const texto = `Olá! Meu nome é ${nome}. Tenho um(a) ${negocio} e gostaria de receber o catálogo técnico.`;
    const linkWa = `https://api.whatsapp.com/send/?phone=559822220088&text=${encodeURIComponent(texto)}`;
    window.open(linkWa, '_blank');
  }
</script>
